<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paws & Proud · Editorial Dashboard Preview</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light;--bg:#faf5ed;--surface:#fffaf3;--ink:#3a2924;--muted:#6f5b52;--line:#e5d5ca;--accent:#a94732;--soft:#f5e5d8}body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}body.dark{color-scheme:dark;--bg:#211c1b;--surface:#302927;--ink:#f3eae0;--muted:#c5b2a8;--line:#53413c;--accent:#e8a58d;--soft:#3e302b}*{box-sizing:border-box}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.banner{background:var(--soft);padding:9px 18px;text-align:center;font-size:13px;font-weight:650}.shell{max-width:1120px;margin:auto;padding:22px clamp(16px,4vw,36px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}header strong{font-size:23px}header small{display:block;color:var(--muted)}.theme{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:18px}.tabs{display:flex;gap:9px;overflow:auto;margin:22px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 17px;border-radius:14px}.tabs button.active{background:var(--ink);color:var(--bg)}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.04em;line-height:1.1;margin:20px 0 8px}p{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat,.card,.editor,.empty{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:20px}.stat strong{font-size:29px;display:block}.stat span{color:var(--muted);font-size:13px}.filters{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 12px;flex-wrap:wrap}.filters select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px}.list{display:grid;gap:12px}.card{display:flex;align-items:center;justify-content:space-between;gap:15px}.card h3{font-size:18px;margin:5px 0}.card p{font-size:14px;margin:0}.pill{display:inline-block;background:var(--soft);color:var(--ink);border-radius:999px;font-size:12px;padding:4px 9px;font-weight:700}.primary,.secondary,.danger{border-radius:13px;padding:11px 17px;font-weight:700}.primary{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.editor{max-width:780px;margin:20px auto}.editor h2{font-size:clamp(24px,3vw,34px);line-height:1.2}.editor textarea{width:100%;min-height:230px;padding:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;line-height:1.7;resize:vertical}.notice{padding:14px;background:var(--soft);border-radius:12px;color:var(--ink);font-size:14px}.hidden{display:none!important}.muted{font-size:13px;color:var(--muted)}.empty{text-align:center;padding:36px}a{color:var(--accent)}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.card{align-items:flex-start;flex-direction:column}.card button{width:100%}.tabs button{padding:10px 12px}} .thumb{width:118px;height:90px;object-fit:cover;border-radius:14px;flex-shrink:0}.draft-row{display:flex;align-items:center;gap:16px;min-width:0}.draft-row>div{min-width:0}.article-preview{width:100%;max-height:340px;aspect-ratio:16/9;object-fit:cover;border-radius:18px;display:block;margin:16px 0 8px}.image-meta{font-size:13px;color:var(--muted);margin:0 0 18px}.image-meta a{color:var(--accent)}@media(max-width:600px){.draft-row{width:100%}.thumb{width:96px;height:84px}.article-preview{aspect-ratio:4/3}}</style></head><body><div class="banner">INTERACTIVE DASHBOARD DESIGN DEMO · Sample drafts only · No live publishing</div><div class="shell"><header><div><strong>🐾 Paws & Proud</strong><small>Editorial workspace</small></div><button class="theme" id="theme">🌙 Dark mode</button></header><nav class="tabs" aria-label="Dashboard sections"><button data-tab="overview">Overview</button><button class="active" data-tab="queue">Review Queue</button><button data-tab="published">Published</button><button data-tab="settings">Settings</button></nav><main id="content" aria-live="polite"></main></div><script>const initial=[{id:1,kind:"Dogs",title:"Five little ways to make walks more fun",status:"Needs source review",body:"A familiar walk can be an adventure. Try letting your dog sniff at a comfortable pace, explore a different safe route, or practice a short game together.\n\nThis is illustrative sample copy, not a fact-checked article.",sources:"No sources attached. Verify claims before approval."},{id:2,kind:"Cats",title:"Why cats love a sunny window",status:"Needs source review",body:"Cats often enjoy warm, comfortable resting places. A secure window perch may offer a place to relax and watch the world.\n\nThis is illustrative sample copy, not a fact-checked article.",sources:"No sources attached. Verify claims before approval."},{id:3,kind:"Dogs",title:"Everyday games for curious dogs",status:"Ready for editorial review",body:"Try a gentle game of finding a favorite toy or a short training activity suited to your dog's abilities.\n\nThis is illustrative sample copy, not a fact-checked article.",sources:"Sample reference placeholder; not verified."}];const photos={Dogs:{url:"https://images.unsplash.com/photo-1679053760771-1b3e4a8149b8?auto=format&fit=crop&w=900&q=80",source:"https://unsplash.com",alt:"Dog outdoors"},Cats:{url:"https://images.unsplash.com/photo-1757064170496-0b7ac1650644?auto=format&fit=crop&w=900&q=80",source:"https://unsplash.com",alt:"Playful orange kitten"}};let drafts=JSON.parse(localStorage.getItem("paws-demo-drafts")||"null")||initial;let tab="queue",filter="All",editing=null;const content=document.getElementById("content");function persist(){localStorage.setItem("paws-demo-drafts",JSON.stringify(drafts))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(editing!==null){let d=drafts.find(x=>x.id===editing);content.innerHTML='<button class="secondary" onclick="editing=null;render()">← Back to queue</button><section class="editor"><span class="pill">'+esc(d.kind)+' · '+esc(d.status)+'</span><h2>'+esc(d.title)+'</h2><img class="article-preview" src="'+photos[d.kind].url+'" alt="'+photos[d.kind].alt+'"><p class="image-meta">Featured image preview · <a href="'+photos[d.kind].source+'" target="_blank" rel="noopener">Source</a> · Verify the exact image license before publishing.</p><p class="muted">Sample article · Editorial approval required</p><label for="body"><strong>Article body</strong></label><textarea id="body">'+esc(d.body)+'</textarea><h3>Source review</h3><p class="notice">'+esc(d.sources)+'<br>Review every factual claim and image license before publication.</p><div class="actions"><button class="secondary" onclick="saveDraft()">Save changes</button><button class="danger" onclick="changeStatus(\'Rejected\')">Reject</button><button class="primary" onclick="changeStatus(\'Approved (demo only)\')">Approve (demo)</button></div><p class="muted">Approval here changes only this browser demo. It does not publish to the website.</p></section>';return}if(tab==="overview"){content.innerHTML='<h1>Editorial overview</h1><p>Everything waiting for your decision, in one place.</p><div class="stats"><div class="stat"><strong>'+drafts.filter(x=>x.status!=="Rejected"&&!x.status.startsWith("Approved")).length+'</strong><span>Awaiting review</span></div><div class="stat"><strong>'+drafts.filter(x=>x.status.startsWith("Approved")).length+'</strong><span>Approved in demo</span></div><div class="stat"><strong>$0</strong><span>Demo spend (not connected)</span></div></div><button class="primary" onclick="tab=\'queue\';render()">Open review queue →</button>';return}if(tab==="published"){content.innerHTML='<h1>Published articles</h1><div class="empty"><strong>No live articles connected</strong><p>This preview does not publish or fetch real articles.</p></div>';return}if(tab==="settings"){content.innerHTML='<h1>Publishing settings</h1><div class="card"><div><h3>Approval required</h3><p>Every article requires explicit owner approval before publishing. Always on.</p></div><span class="pill">Required</span></div><div class="card" style="margin-top:12px"><div><h3>Monthly budget target</h3><p>$15 maximum · Enforcement requires a real backend and spending ledger.</p></div><span class="pill">Planned</span></div>';return}const visible=drafts.filter(x=>filter==="All"||x.kind===filter).filter(x=>x.status!=="Rejected");content.innerHTML='<h1>Review queue</h1><p>Review each article, inspect sources, and decide what gets published.</p><div class="stats"><div class="stat"><strong>'+drafts.filter(x=>!x.status.startsWith("Approved")&&x.status!=="Rejected").length+'</strong><span>Needs attention</span></div><div class="stat"><strong>'+drafts.filter(x=>x.kind==="Dogs").length+'</strong><span>Dog drafts</span></div><div class="stat"><strong>'+drafts.filter(x=>x.kind==="Cats").length+'</strong><span>Cat drafts</span></div></div><div class="filters"><strong>Drafts ('+visible.length+')</strong><label>Category <select id="filter"><option>All</option><option>Dogs</option><option>Cats</option></select></label></div><div class="list">'+visible.map(d=>'<div class="card"><div class="draft-row"><img class="thumb" src="'+photos[d.kind].url+'" alt="'+photos[d.kind].alt+'" loading="lazy"><div><span class="pill">'+esc(d.kind)+'</span> <span class="pill">'+esc(d.status)+'</span><h3>'+esc(d.title)+'</h3><p>Illustrative draft · Not published</p></div></div><button class="primary" onclick="editing='+d.id+';render()">Review draft →</button></div>').join("")+'</div>';document.getElementById("filter").value=filter;document.getElementById("filter").onchange=e=>{filter=e.target.value;render()}}function saveDraft(){let d=drafts.find(x=>x.id===editing);d.body=document.getElementById("body").value;d.status="Edited · Needs review";persist();editing=null;render()}function changeStatus(status){let d=drafts.find(x=>x.id===editing);d.body=document.getElementById("body").value;d.status=status;persist();editing=null;render()}document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;editing=null;render()});const theme=document.getElementById("theme");function setTheme(d){document.body.classList.toggle("dark",d);theme.textContent=d?"☀️ Light mode":"🌙 Dark mode";localStorage.setItem("paws-dashboard-dark",d?"1":"0")}setTheme(localStorage.getItem("paws-dashboard-dark")==="1");theme.onclick=()=>setTheme(!document.body.classList.contains("dark"));render();</script></body></html>
